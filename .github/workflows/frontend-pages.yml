name: Publicar frontend no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["recuperacao/frontend/**", "recuperacao/sistema_de_busca/config.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # catálogo estático de temas (topicos.json): o site mostra os temas sem esperar a API acordar
      - run: |
          pip install "python-dotenv>=1.0,<2"
          python -m recuperacao.sistema_de_busca.catalogo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: recuperacao/frontend
          # nome por tentativa: ao usar "Re-run" o artifact da tentativa anterior continua no run,
          # e dois "github-pages" fazem o deploy-pages falhar
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
