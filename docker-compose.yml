# Stack local: MinIO (data lake) + Airflow (orquestração) + Postgres (metadados do Airflow).
#
#   cp .env.example .env    # preencha os valores (instruções no arquivo)
#   mkdir -p data/cache
#   docker compose up -d --build
#
# Airflow: http://localhost:8085 (usuário admin, senha AIRFLOW_ADMIN_PASSWORD)
# MinIO:   console http://localhost:9011 · API S3 http://localhost:9010
# As portas só ficam acessíveis nesta máquina (127.0.0.1).

name: tcc

# --------------------------------------------------------------------------- #
# Configuração comum aos serviços do Airflow
# --------------------------------------------------------------------------- #
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  image: tcc-airflow:3.0.6
  # UID do host (AIRFLOW_UID) e GID 0, grupo dono de /opt/airflow na imagem:
  # arquivos criados nos volumes montados ficam com o dono do usuário do host.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Silver e Gold são disparadas por assets; pausadas, a cadeia para na Bronze.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina AIRFLOW_FERNET_KEY no .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-airflow}
    # Componentes em containers separados precisam do mesmo segredo para
    # assinar/validar os tokens da Execution API (tasks <-> api-server).
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?defina AIRFLOW_API_SECRET_KEY no .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Login simples (usuário admin); a senha vem do .env, ver airflow-apiserver.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
    # O bootstrap do dag-processor neste ambiente passa do padrão de 50s.
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "300"
    # scrape_componentes_sigaa com ementas fica ~12 min sem sinal de vida;
    # o padrão (5 min) o mataria como task "zumbi".
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1800"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Data lake: dentro da rede do compose o MinIO é alcançado pelo nome do serviço.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY no .env}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY no .env}
    MINIO_REGION: ${MINIO_REGION:-us-east-1}
    MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
    MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
    MINIO_GOLD_BUCKET: ${MINIO_GOLD_BUCKET:-gold}
    # Parâmetros opcionais do pipeline (vazio = padrão do código).
    TZ_COLETA: ${TZ_COLETA:-America/Sao_Paulo}
    LATTES_CACHE_DIAS: ${LATTES_CACHE_DIAS:-}
    ANO_MINIMO: ${ANO_MINIMO:-}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/project/src:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ------------------------------------------------------------------------- #
  # Data lake
  # ------------------------------------------------------------------------- #
  minio:
    # As imagens oficiais minio/minio deixaram de ser distribuídas publicamente
    # (2025). A bitnamilegacy é baixável e tem versão fixa, mas não recebe
    # atualizações: ver "Imagem do MinIO" em docs/arquitetura.md.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
      MINIO_GOLD_BUCKET: ${MINIO_GOLD_BUCKET:-gold}
      # O mc grava a config em $HOME; o usuário da imagem não tem home gravável.
      HOME: /tmp
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------------- #
  # Metadados do Airflow (histórico de execuções, estado dos assets)
  # ------------------------------------------------------------------------- #
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Airflow
  # ------------------------------------------------------------------------- #
  airflow-init:
    <<: *airflow-common
    # Migra o banco de metadados e termina.
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    # Grava a senha do admin (do .env) antes de subir. O entrypoint da imagem
    # é mantido: é ele que registra o AIRFLOW_UID como usuário do sistema.
    command:
      - bash
      - -c
      - |
        printf '{"admin": "%s"}' "$${AIRFLOW_ADMIN_PASSWORD}" > /opt/airflow/passwords.json
        exec airflow api-server
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina AIRFLOW_ADMIN_PASSWORD no .env}
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Com LocalExecutor as tasks rodam neste container, por isso só ele
    # recebe o cache do scriptLattes e a capability do sandbox do Chromium
    # (sem ela: "session not created: Chrome instance exited").
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/project/src:ro
      - ./data/cache:/opt/project/data/cache
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
