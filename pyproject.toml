[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

# Dependências lidas dos requirements, para não manter duas listas
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt", "requirements-busca.txt"] }

[tool.setuptools.packages.find]
include = ["storage*", "recuperacao*"]