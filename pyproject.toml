[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigaa-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "qdrant-client",
    "FlagEmbedding",
]

[tool.setuptools.packages.find]
include = ["storage*", "recuperacao*"]